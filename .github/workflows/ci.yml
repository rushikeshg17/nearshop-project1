# Continuous integration: every pull request and every push to main runs four checks (backend,
# frontend, secret-scan, dependency-audit), plus search-eval (P5.1), which does real work only when a
# change touches search. They block merging only once main's branch protection requires them, which
# the tech lead sets up in the repository settings. Render deploys only a
# commit whose checks passed (render.yaml, autoDeployTrigger: checksPass). make ci runs the same
# checks locally, apart from GitHub's dependency review.
#
# CI never receives a MongoDB Atlas URI or any other secret: the tests run against a throwaway
# MongoDB inside the backend job, and the frontend build uses a dummy API origin.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Every Monday on main, only the dependency audit runs, so a new advisory against unchanged code
  # is caught, and search-eval refreshes the main baseline so its cache never expires (GitHub drops a
  # cache unused for 7 days). 03:30 UTC is 09:00 in India.
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19" # has uv audit; keep in step with the team's uv
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball

jobs:
  backend:
    name: backend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LOCKED: "1" # fail if backend/uv.lock is out of date with pyproject.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Ruff
        run: make lint-backend

      # docker-compose.yml runs mongo:7.0 as the single-node replica set rs0. Its health check
      # initiates the set, and --wait returns only once this node is a writable primary.
      - name: Start MongoDB (single-node replica set) and wait until it is primary
        run: make db-up

      - name: Pytest
        env:
          NEARSHOP_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
        run: make test DB_UP=

      - name: MongoDB logs (on failure)
        if: failure()
        run: docker compose logs --tail 200 mongo

  # Search evaluation (P5.1, backend/eval/README.md): the dev split of the labelled queries through run_search on
  # a freshly seeded local database. On every push to main, and every Monday, its figures are cached as the
  # baseline; a pull request that touches search, text, embeddings, semantic-index, the harness, the labels or the
  # seed runs it, writes the summary to the job summary and fails when dev nDCG@10 drops by more than 0.02 against
  # the latest main run. When no main baseline can be restored, the job measures the pull request's base commit in
  # the same job instead, so the check never silently stops comparing. Other pull requests pass this job without
  # running it. The test split never runs in CI. The summary goes to the job summary rather than a pull request
  # comment: a comment needs a pull-requests: write token in a job that runs the pull request's code.
  search-eval:
    name: search-eval
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request checks out its merge commit; HEAD^1 is the base branch
          persist-credentials: false

      - name: Does this change touch search?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          pattern='^backend/(app/services/search\.py|app/utils/text|app/ai/(embeddings|semantic_index|search_eval)\.py|eval/|database/seed/)'
          if git diff --name-only HEAD^1 HEAD | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Search evaluation skipped: this pull request touches no search, text, embeddings or semantic-index file." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: backend
        run: uv sync --locked

      - name: Start MongoDB (single-node replica set) and wait until it is primary
        if: steps.scope.outputs.run == 'true'
        run: make db-up

      # The latest main run's figures (caches saved on main are readable from pull requests).
      - name: Restore the main baseline
        id: baseline
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: search-eval-baseline.json
          key: search-eval-main-none-${{ github.run_id }}
          restore-keys: search-eval-main-

      # No cached main run (none yet, or GitHub dropped it): measure the base commit here instead.
      - name: Measure the base commit when no main baseline was restored
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key == ''
        run: |
          echo "::warning title=search-eval::No cached main baseline; measuring the base commit in this job instead."
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          if [ ! -f "$RUNNER_TEMP/base/backend/app/ai/search_eval.py" ]; then
            echo "::warning title=search-eval::The base commit has no search evaluation harness, so there is nothing to compare with."
            echo "**No baseline:** the base commit predates the search evaluation harness." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd "$RUNNER_TEMP/base/backend" && uv sync --locked)
          make -C "$RUNNER_TEMP/base" eval DB_UP= EVAL_DB=nearshop_eval_base EVAL_SPLIT=dev \
            EVAL_MODEL_DIR="$RUNNER_TEMP/eval-models-base" \
            EVAL_ARGS="--no-store --output $GITHUB_WORKSPACE/search-eval-baseline.json"

      - name: Dev split
        if: steps.scope.outputs.run == 'true'
        run: |
          args="--output $GITHUB_WORKSPACE/search-eval.json --summary $GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -f "$GITHUB_WORKSPACE/search-eval-baseline.json" ]; then
              args="$args --baseline $GITHUB_WORKSPACE/search-eval-baseline.json"
            else
              echo "::warning title=search-eval::No baseline to compare dev nDCG@10 with; this run is not a regression check."
            fi
          fi
          make eval DB_UP= EVAL_SPLIT=dev EVAL_MODEL_DIR="$RUNNER_TEMP/eval-models" EVAL_ARGS="$args"

      - name: Keep this run as the main baseline
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        run: cp search-eval.json search-eval-baseline.json

      - name: Save the main baseline
        if: steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: search-eval-baseline.json
          key: search-eval-main-${{ github.sha }}-${{ github.run_id }}

  frontend:
    name: frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install from package-lock.json
        working-directory: frontend
        run: npm ci

      - name: tsc and eslint
        run: make lint-frontend

      - name: Production build
        env:
          NEARSHOP_API_ORIGIN: http://api.invalid # dummy: the build only writes it into the proxy rewrites
        run: make build

  secret-scan:
    name: secret-scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history of every branch and tag
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir -p gitleaks-bin && tar -xzf "$tarball" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: gitleaks over the full git history
        run: make secret-scan

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm audit of the frontend's production dependencies and uv audit of backend/uv.lock. Fails on
      # any high or critical advisory not waived in .github/dependency-waivers.yml, and on any expired
      # waiver or one that runs more than 30 days ahead.
      - name: npm and uv audit against the waivers
        run: make audit

      - name: Read the waived advisories for dependency review
        id: waivers
        if: github.event_name == 'pull_request'
        run: echo "ghsas=$(make -s audit-waived-ghsas)" >> "$GITHUB_OUTPUT"

      # Blocks a pull request that adds or upgrades to a dependency with a high or critical advisory,
      # in any ecosystem GitHub's dependency graph reads (npm, uv/pip, GitHub Actions).
      - name: GitHub dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-ghsas: ${{ steps.waivers.outputs.ghsas }}
