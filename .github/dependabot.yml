# Weekly dependency updates, at most 5 open pull requests per ecosystem. Each pull request runs the
# full CI (.github/workflows/ci.yml) and needs a review like any other change. Security updates for
# advisories come separately, once Dependabot security updates are turned on in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
