# Render Blueprint for the NearShop API (the frontend is deployed on Vercel). Two web services and four
# cron jobs:
#   nearshop-api-staging         tracks main     NEARSHOP_ENVIRONMENT=staging     Starter  (0.5 CPU, 512 MB)
#   nearshop-api                 tracks release  NEARSHOP_ENVIRONMENT=production  Standard (1 CPU, 2 GB), always on
#   nearshop-backup-staging      tracks main     nightly off-site backup of the staging database
#   nearshop-backup-production   tracks release  nightly off-site backup of the production database
#   nearshop-retrain-staging     tracks main     model training for the staging database, outside the API
#   nearshop-retrain-production  tracks release  model training for the production database, outside the API
# Every change reaches staging first; production deploys only when release is fast-forwarded to a main
# commit whose staging smoke test passed (docs/runbooks/release-and-rollback.md).
#
# Render dashboard > New > Blueprint > pick this repository. Each service asks for its own
# NEARSHOP_MONGODB_URI, NEARSHOP_SECRET_KEY, NEARSHOP_PROTECTED_HOSTS and NEARSHOP_MEDIA_* photo-bucket
# settings (sync: false): staging and production never share a database, a signing key, a bucket or a
# value of any secret. Render prompts for sync: false values only when a service is first created, and
# later Blueprint syncs leave them as set in the dashboard.
#
# Plan IDs are Render's current names for the instance types, for web services and cron jobs alike:
# 0.5c-512mb is Starter and 1c-2g is Standard.
# Both web services deploy a push only after its GitHub checks pass (.github/workflows/ci.yml), and both
# run the schema migrations as their pre-deploy step (paid instance types only; see
# docs/runbooks/release-and-rollback.md).
services:
  - type: web
    name: nearshop-api-staging
    runtime: python
    plan: 0.5c-512mb # Starter
    region: singapore
    branch: main
    rootDir: backend
    # The search model (90 MB) is downloaded while building, so a cold start does not wait for it.
    buildCommand: >-
      pip install uv && uv sync --frozen --no-dev &&
      uv run --no-dev python -c "from app.ai.embeddings import get_provider; get_provider()"
    # Schema migrations (backend/database/migrate.py) run after the build and before the new version
    # starts, while the previous version still serves. A failure stops the deploy; nothing new goes live.
    preDeployCommand: uv run --no-dev python -m database.migrate
    # One worker: the semantic search index lives inside each API process, so a second worker would hold
    # a second index (until P8.1). Background jobs no longer stop a second process or instance: each job
    # runs only in the process holding its lease in job_leases (app/jobs.py, P1.7).
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    # /api/health is liveness only (it also reports RENDER_GIT_COMMIT, which tells the smoke workflow which
    # commit it tests). Uptime monitors use /api/health/ready instead (plan section 8.10): booleans for the
    # database ping, the schema migrations, the search index and the sweep heartbeat, 503 when the database
    # or the migrations fail. Render's health check stays on /api/health, so a database outage does not make
    # Render restart an API that is otherwise fine.
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEARSHOP_ENVIRONMENT
        value: staging
      - key: NEARSHOP_SECRET_KEY
        sync: false # secret: staging's own key, python3 -c "import secrets;print(secrets.token_urlsafe(48))"
      - key: NEARSHOP_MONGODB_URI
        sync: false # secret: the staging Atlas cluster's connection string, never production's
      - key: NEARSHOP_PROTECTED_HOSTS
        # the staging and production Atlas project domains, comma-separated. The seed refuses both; the
        # one-time load of staging's data is in the runbook (One-time set-up, step 5).
        sync: false
      - key: NEARSHOP_MONGODB_DB
        value: nearshop
      - key: NEARSHOP_COOKIE_SECURE
        value: "true"
      - key: NEARSHOP_SEED_CITY
        value: ballari
      # Same lockdown as production, so staging tests what production runs.
      - key: NEARSHOP_SIGNUPS_OPEN
        value: "false"
      - key: NEARSHOP_DEMO_MODE
        value: "true"
      # Photos in staging's own Cloudflare R2 bucket (P1.5; the API's disk is wiped on every deploy). Set
      # NEARSHOP_MEDIA_BACKEND to s3 once the bucket exists; left unset or blank, the API keeps photos on
      # its disk and logs a warning at startup. The R2 API token is scoped to the staging photo bucket only.
      # On a service that already exists, add these six in the dashboard (Environment): a Blueprint sync
      # does not prompt for new sync: false values.
      - key: NEARSHOP_MEDIA_BACKEND
        sync: false # s3
      - key: NEARSHOP_MEDIA_S3_ENDPOINT
        sync: false # https://<account id>.r2.cloudflarestorage.com
      - key: NEARSHOP_MEDIA_S3_BUCKET
        sync: false # the staging photo bucket
      - key: NEARSHOP_MEDIA_S3_ACCESS_KEY_ID
        sync: false # secret: staging's R2 token, Object Read & Write on the staging photo bucket
      - key: NEARSHOP_MEDIA_S3_SECRET_ACCESS_KEY
        sync: false # secret
      - key: NEARSHOP_MEDIA_PUBLIC_BASE_URL
        sync: false # the staging bucket's public custom domain, for example https://media-staging.<domain>
      # Error tracking (P2.1, app/core/observability.py): on only when this DSN is set. Events are tagged with
      # NEARSHOP_ENVIRONMENT and carry RENDER_GIT_COMMIT as the release; cookies, the authorization header,
      # request bodies, phone numbers, emails and street addresses are removed before sending. On a service
      # that already exists, add it in the dashboard (Environment): a Blueprint sync does not prompt for it.
      - key: NEARSHOP_SENTRY_DSN
        sync: false # the Sentry project's DSN (Settings > Client Keys); the same project for both services
      # Admin second factor (P2.4, app/core/security.py): the Fernet key that encrypts admins' TOTP secrets.
      # Without it every admin sign-in answers 503 totp_unavailable. Staging's own key, never production's;
      # create-admin runs as a one-off job on this service so it uses the same value. On a service that
      # already exists, add it in the dashboard (Environment) before deploying P2.4: a Blueprint sync does
      # not prompt for it.
      - key: NEARSHOP_TOTP_KEY
        sync: false # secret: uv run python -c "from app.core.security import generate_totp_key as g; print(g())"
      # Storage budget (P2.2): the Atlas tier's storage limit, for the admin storage card and the daily
      # snapshot's 70% and 85% warnings. Staging is on M0 (512 MB). Alerts: docs/runbooks/monitoring.md.
      - key: NEARSHOP_STORAGE_LIMIT_MB
        value: "512"

  - type: web
    name: nearshop-api
    runtime: python
    plan: 1c-2g # Standard: always on (a free instance sleeps after 15 idle minutes and must not serve production)
    region: singapore
    branch: release
    rootDir: backend
    buildCommand: >-
      pip install uv && uv sync --frozen --no-dev &&
      uv run --no-dev python -c "from app.ai.embeddings import get_provider; get_provider()"
    preDeployCommand: uv run --no-dev python -m database.migrate
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health # liveness; monitors use /api/health/ready (see the staging service)
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEARSHOP_ENVIRONMENT
        value: production
      - key: NEARSHOP_SECRET_KEY
        sync: false # secret: production's own key (an existing service keeps the key it already has)
      - key: NEARSHOP_MONGODB_URI
        sync: false # secret: the production Atlas cluster's connection string
      - key: NEARSHOP_PROTECTED_HOSTS
        sync: false # the staging and production Atlas project domains, comma-separated
      - key: NEARSHOP_MONGODB_DB
        value: nearshop
      - key: NEARSHOP_COOKIE_SECURE
        value: "true"
      - key: NEARSHOP_SEED_CITY
        value: ballari
      # Launch lockdown (P0.2): sign-ups stay closed until launch, and the site shows a banner saying
      # it runs on generated data.
      - key: NEARSHOP_SIGNUPS_OPEN
        value: "false"
      - key: NEARSHOP_DEMO_MODE
        value: "true"
      # Photos in production's own Cloudflare R2 bucket (P1.5), never the staging bucket or its token.
      - key: NEARSHOP_MEDIA_BACKEND
        sync: false # s3
      - key: NEARSHOP_MEDIA_S3_ENDPOINT
        sync: false # https://<account id>.r2.cloudflarestorage.com
      - key: NEARSHOP_MEDIA_S3_BUCKET
        sync: false # the production photo bucket
      - key: NEARSHOP_MEDIA_S3_ACCESS_KEY_ID
        sync: false # secret: production's R2 token, Object Read & Write on the production photo bucket
      - key: NEARSHOP_MEDIA_S3_SECRET_ACCESS_KEY
        sync: false # secret
      - key: NEARSHOP_MEDIA_PUBLIC_BASE_URL
        sync: false # the production bucket's public custom domain, for example https://media.<domain>
      # Error tracking (P2.1): on only when set; see the staging service.
      - key: NEARSHOP_SENTRY_DSN
        sync: false # the Sentry project's DSN
      # Admin second factor (P2.4): production's own key; see the staging service. Add it before deploying P2.4.
      - key: NEARSHOP_TOTP_KEY
        sync: false # secret: production's own Fernet key, never staging's
      # Storage budget (P2.2): Atlas Flex, 5 GB (plan step 1-A). Set 512 while production is still on M0.
      - key: NEARSHOP_STORAGE_LIMIT_MB
        value: "5120"

  # Nightly off-site backup of the staging database (P1.6, backend/database/backup.py): every collection as
  # gzipped BSON plus a manifest, in the private backup bucket under staging/<set id>/, then sets older than
  # the retention rule (30 daily, 12 monthly) are deleted. Every run writes a row to backup_runs in the
  # staging database: the heartbeat (alert when no run has succeeded for 26 hours). Restores and the drill
  # run as one-off jobs on this service (docs/runbooks/restore.md), which reuse its settings.
  - type: cron
    name: nearshop-backup-staging
    runtime: python
    plan: 0.5c-512mb # Starter
    region: singapore
    branch: main
    rootDir: backend
    schedule: "30 21 * * *" # 21:30 UTC, 03:00 IST
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # After a successful run only, the Better Stack heartbeat is pinged (P2.2, docs/runbooks/monitoring.md):
    # Better Stack alerts when no ping arrives for 26 hours. Blank NEARSHOP_BACKUP_HEARTBEAT_URL: no ping. A
    # failed ping is reported but does not fail a backup that succeeded; the missing ping alerts on its own.
    startCommand: >-
      uv run --no-dev python -m database.backup &&
      { [ -z "$NEARSHOP_BACKUP_HEARTBEAT_URL" ] ||
      curl -fsS -m 30 --retry 3 -o /dev/null "$NEARSHOP_BACKUP_HEARTBEAT_URL" ||
      echo "backup heartbeat ping failed" >&2; }
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEARSHOP_ENVIRONMENT
        value: staging
      # The same database as the staging API: its connection string is read from that service, so it is
      # entered once, in the API's settings.
      - key: NEARSHOP_MONGODB_URI
        fromService:
          type: web
          name: nearshop-api-staging
          envVarKey: NEARSHOP_MONGODB_URI
      - key: NEARSHOP_MONGODB_DB
        value: nearshop
      - key: NEARSHOP_BACKUP_PREFIX
        value: staging
      # The API's photo bucket, read from that service, only so backup.py can refuse a
      # NEARSHOP_BACKUP_S3_BUCKET that names it (blank while the API keeps photos on its disk).
      - key: NEARSHOP_MEDIA_S3_BUCKET
        fromService:
          type: web
          name: nearshop-api-staging
          envVarKey: NEARSHOP_MEDIA_S3_BUCKET
      # The private backup bucket (never a photo bucket) and an R2 API token scoped to it, Object Read &
      # Write. Until NEARSHOP_BACKUP_BACKEND is s3 every run fails with "NEARSHOP_BACKUP_BACKEND is off".
      - key: NEARSHOP_BACKUP_BACKEND
        sync: false # s3
      - key: NEARSHOP_BACKUP_S3_ENDPOINT
        sync: false # https://<account id>.r2.cloudflarestorage.com
      - key: NEARSHOP_BACKUP_HEARTBEAT_URL
        sync: false # Better Stack > Heartbeats > nearshop-backup-staging: its URL (period 24 h, grace 2 h)
      - key: NEARSHOP_BACKUP_S3_BUCKET
        sync: false # the staging backup bucket
      - key: NEARSHOP_BACKUP_S3_ACCESS_KEY_ID
        sync: false # secret: the staging backup token, never the photo token
      - key: NEARSHOP_BACKUP_S3_SECRET_ACCESS_KEY
        sync: false # secret

  # Nightly off-site backup of the production database (P1.6, backend/database/backup.py): every collection as
  # gzipped BSON plus a manifest, in the private backup bucket under production/<set id>/, then sets older than
  # the retention rule (30 daily, 12 monthly) are deleted. Every run writes a row to backup_runs in the
  # production database: the heartbeat (alert when no run has succeeded for 26 hours). Restores and the drill
  # run as one-off jobs on this service (docs/runbooks/restore.md), which reuse its settings.
  - type: cron
    name: nearshop-backup-production
    runtime: python
    plan: 0.5c-512mb # Starter
    region: singapore
    branch: release
    rootDir: backend
    schedule: "30 21 * * *" # 21:30 UTC, 03:00 IST
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # After a successful run only, the Better Stack heartbeat is pinged (P2.2, docs/runbooks/monitoring.md):
    # Better Stack alerts when no ping arrives for 26 hours. Blank NEARSHOP_BACKUP_HEARTBEAT_URL: no ping. A
    # failed ping is reported but does not fail a backup that succeeded; the missing ping alerts on its own.
    startCommand: >-
      uv run --no-dev python -m database.backup &&
      { [ -z "$NEARSHOP_BACKUP_HEARTBEAT_URL" ] ||
      curl -fsS -m 30 --retry 3 -o /dev/null "$NEARSHOP_BACKUP_HEARTBEAT_URL" ||
      echo "backup heartbeat ping failed" >&2; }
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEARSHOP_ENVIRONMENT
        value: production
      # The same database as the production API: its connection string is read from that service, so it is
      # entered once, in the API's settings.
      - key: NEARSHOP_MONGODB_URI
        fromService:
          type: web
          name: nearshop-api
          envVarKey: NEARSHOP_MONGODB_URI
      - key: NEARSHOP_MONGODB_DB
        value: nearshop
      - key: NEARSHOP_BACKUP_PREFIX
        value: production
      # The API's photo bucket, read from that service, only so backup.py can refuse a
      # NEARSHOP_BACKUP_S3_BUCKET that names it (blank while the API keeps photos on its disk).
      - key: NEARSHOP_MEDIA_S3_BUCKET
        fromService:
          type: web
          name: nearshop-api
          envVarKey: NEARSHOP_MEDIA_S3_BUCKET
      # The private backup bucket (never a photo bucket) and an R2 API token scoped to it, Object Read &
      # Write. Until NEARSHOP_BACKUP_BACKEND is s3 every run fails with "NEARSHOP_BACKUP_BACKEND is off".
      - key: NEARSHOP_BACKUP_BACKEND
        sync: false # s3
      - key: NEARSHOP_BACKUP_S3_ENDPOINT
        sync: false # https://<account id>.r2.cloudflarestorage.com
      - key: NEARSHOP_BACKUP_HEARTBEAT_URL
        sync: false # Better Stack > Heartbeats > nearshop-backup-production: its URL (period 24 h, grace 2 h)
      - key: NEARSHOP_BACKUP_S3_BUCKET
        sync: false # the production backup bucket
      - key: NEARSHOP_BACKUP_S3_ACCESS_KEY_ID
        sync: false # secret: the production backup token, never the photo token
      - key: NEARSHOP_BACKUP_S3_SECRET_ACCESS_KEY
        sync: false # secret

  # Model training (P1.7, app/ai/pipeline.py --cron and app/jobs.py), never inside the API: the training
  # libraries (scikit-learn, pandas, gensim, mlxtend) would stay in the API's memory. Every 30 minutes the
  # job starts, processes one retrain an admin queued (POST /api/ai/retrain, at most 3 a day) or, in the
  # 21:00 UTC (02:30 IST) run, the nightly retrain, records the outcome in retrain_requests (what the AI
  # model cards show), and exits. A run with nothing to do never loads the training libraries. Training
  # needs more memory than a backup, hence Standard; a cron job is billed only while it runs.
  - type: cron
    name: nearshop-retrain-staging
    runtime: python
    plan: 1c-2g # Standard
    region: singapore
    branch: main
    rootDir: backend
    schedule: "*/30 * * * *" # every 30 minutes; the 21:00 UTC run is the nightly retrain
    # The search model is downloaded while building, as for the API: training rebuilds the search index.
    buildCommand: >-
      pip install uv && uv sync --frozen --no-dev &&
      uv run --no-dev python -c "from app.ai.embeddings import get_provider; get_provider()"
    startCommand: uv run --no-dev python -m app.ai.pipeline --cron
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEARSHOP_ENVIRONMENT
        value: staging
      # The same database as the staging API, read from that service.
      - key: NEARSHOP_MONGODB_URI
        fromService:
          type: web
          name: nearshop-api-staging
          envVarKey: NEARSHOP_MONGODB_URI
      - key: NEARSHOP_MONGODB_DB
        value: nearshop

  - type: cron
    name: nearshop-retrain-production
    runtime: python
    plan: 1c-2g # Standard
    region: singapore
    branch: release
    rootDir: backend
    schedule: "*/30 * * * *" # every 30 minutes; the 21:00 UTC run is the nightly retrain
    buildCommand: >-
      pip install uv && uv sync --frozen --no-dev &&
      uv run --no-dev python -c "from app.ai.embeddings import get_provider; get_provider()"
    startCommand: uv run --no-dev python -m app.ai.pipeline --cron
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NEARSHOP_ENVIRONMENT
        value: production
      # The same database as the production API, read from that service.
      - key: NEARSHOP_MONGODB_URI
        fromService:
          type: web
          name: nearshop-api
          envVarKey: NEARSHOP_MONGODB_URI
      - key: NEARSHOP_MONGODB_DB
        value: nearshop
